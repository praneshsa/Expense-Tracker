<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="script.js">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
      <button id="clearAllBtn" class="btn btn-ghost" type="button">Clear all</button>
    </header>

    <!-- Summary cards -->
    <section class="summary" aria-label="Summary">
      <div class="card stat">
        <span class="stat-label">Total balance</span>
        <span class="stat-value balance" id="totalBalance">$0.00</span>
      </div>
      <div class="card stat">
        <span class="stat-label">Total income</span>
        <span class="stat-value income" id="totalIncome">$0.00</span>
      </div>
      <div class="card stat">
        <span class="stat-label">Total expenses</span>
        <span class="stat-value expense" id="totalExpenses">$0.00</span>
      </div>
      <div class="card stat">
        <span class="stat-label">Transactions</span>
        <span class="stat-value" id="transactionCount">0</span>
      </div>
    </section>

    <main class="layout">
      <div class="left-col">
        <!-- Add / edit transaction -->
        <section class="card" aria-labelledby="formTitle">
          <h2 id="formTitle">➕ Add transaction</h2>
          <form id="transactionForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g. Groceries" maxlength="60" autocomplete="off">
              </div>
              <div class="field">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01">
              </div>
              <div class="field">
                <label for="category">Category</label>
                <select id="category"></select>
              </div>
              <div class="field">
                <label for="date">Date</label>
                <input type="date" id="date">
              </div>
            </div>

            <div class="form-footer">
              <div class="type-toggle" role="radiogroup" aria-label="Transaction type">
                <label><input type="radio" name="type" value="expense" checked> Expense</label>
                <label><input type="radio" name="type" value="income"> Income</label>
              </div>
              <div class="form-actions">
                <button type="button" id="cancelEditBtn" class="btn btn-ghost" hidden>Cancel</button>
                <button type="submit" id="submitBtn" class="btn btn-primary">+ Add</button>
              </div>
            </div>
            <p id="formError" class="form-error" role="alert" hidden></p>
          </form>
        </section>

        <!-- Chart -->
        <section class="card" aria-labelledby="chartTitle">
          <h2 id="chartTitle">📊 Spending by category</h2>
          <div class="chart-wrap">
            <canvas id="categoryChart" width="260" height="260" aria-label="Doughnut chart of expenses by category"></canvas>
            <p id="chartEmpty" class="empty" hidden>Add an expense to see your spending breakdown.</p>
          </div>
          <ul id="chartLegend" class="legend"></ul>
        </section>
      </div>

      <!-- Transactions list -->
      <section class="card transactions" aria-labelledby="listTitle">
        <h2 id="listTitle">📋 Transactions</h2>
        <div class="filters">
          <select id="filterCategory" aria-label="Filter by category"></select>
          <select id="filterType" aria-label="Filter by type">
            <option value="all">All</option>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <ul id="transactionList" class="tx-list"></ul>
        <p id="listEmpty" class="empty" hidden>No transactions yet. Add your first one.</p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
